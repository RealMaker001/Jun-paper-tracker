name: Collect arXiv Papers

on:
  schedule:
    # 매일 03:00 UTC (= 12:00 KST). arXiv 신규 논문 공개(00:00 UTC 전후) 이후.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일을 다시 수집 (비우면 자동)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect-papers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 외부 패키지가 없으므로 pip install 단계가 없습니다.
      - name: Collect papers
        env:
          DAYS: ${{ github.event.inputs.days }}
        run: |
          if [ -n "$DAYS" ]; then
            python tracker.py --days "$DAYS"
          else
            python tracker.py
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data lists
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋하지 않습니다."
          else
            git commit -m "Update papers $(date -u +%Y-%m-%d)"
            git push
          fi
